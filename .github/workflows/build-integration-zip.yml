name: Build Econergy integration ZIP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build econergy.zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read integration version and compile
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/econergy/manifest.json", encoding="utf-8"))["version"])')"
          if [ -z "$VERSION" ]; then
            echo "The integration manifest does not declare a version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Econergy Cloud $VERSION"
          python -m compileall -q custom_components/econergy

      - name: Create integration ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/econergy
          zip -r "$GITHUB_WORKSPACE/econergy.zip" . -x "*.pyc" "__pycache__/*" ".DS_Store"
          cd "$GITHUB_WORKSPACE"
          test -s econergy.zip
          unzip -l econergy.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: econergy-${{ steps.version.outputs.version }}
          path: econergy.zip
          if-no-files-found: error
          retention-days: 30
